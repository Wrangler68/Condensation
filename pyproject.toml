[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jooyoup-heat-transfer"
version = "0.1.0"
description = "Auditable biphilic condensation models and interactive marimo notebooks"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "autograd>=1.7,<2", "plotly>=6,<7", "marimo>=0.19,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
properties = ["CoolProp>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/condensation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
